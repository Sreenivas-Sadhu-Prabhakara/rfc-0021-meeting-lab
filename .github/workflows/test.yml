name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run ./cmd/meetinglab -html < examples/rfc21.json | diff -u docs/index.html -
